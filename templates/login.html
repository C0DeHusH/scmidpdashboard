<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCM Admin Login</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script>(function(){const s=localStorage.getItem('scm-theme');const p=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=s||p})();</script><script src="https://cdn.tailwindcss.com"></script>
<style>:root{color-scheme:dark}html[data-theme="light"]{color-scheme:light}body{background:#020617;color:#f8fafc;font-family:"Inter","Segoe UI",sans-serif}h1{font-family:"Manrope","Inter",sans-serif;letter-spacing:-.03em}html[data-theme="light"] body{background:#f1f5f9;color:#0f172a}html[data-theme="light"] .login-card{background:#fff;border-color:#cbd5e1}html[data-theme="light"] input{background:#fff;color:#0f172a;border-color:#94a3b8}html[data-theme="light"] .muted{color:#475569}</style></head>
<body class="min-h-screen flex items-center justify-center p-6"><div class="login-card w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/90 p-8 shadow-2xl"><div class="flex items-center justify-between"><div class="text-xs font-bold tracking-[0.3em] text-amber-400">MUTI MC • SCM</div><button id="themeBtn" type="button" class="rounded-lg border border-slate-700 px-2 py-1 text-xs">Theme</button></div><h1 class="mt-3 text-3xl font-bold">Admin Access</h1><p class="muted mt-2 text-sm text-slate-400">Import new data and export presentation-ready PowerPoint / branch request files.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="mt-4 rounded-xl bg-red-950 p-3 text-sm text-red-300">{{ messages[0][1] }}</div>{% endif %}{% endwith %}
<form method="post" class="mt-6 space-y-4"><input name="password" type="password" required placeholder="Admin password" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:border-amber-400"><button class="w-full rounded-xl bg-amber-500 px-4 py-3 font-bold text-slate-950 hover:bg-amber-400">Sign in as Admin</button></form><a href="/" class="muted mt-5 block text-center text-sm text-slate-400">Continue as Guest</a></div>
<script>document.querySelector('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('scm-theme',n)}</script></body></html>
